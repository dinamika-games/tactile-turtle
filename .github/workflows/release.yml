name: Release

# Pushing a tag v* builds the game and the printable PDFs (the tiles in every
# language, the smaller kits for worlds 1, 1-2 and 1-3, and the plates), checks
# the PDFs with the game's own detector, and attaches everything to the GitHub
# Release of that tag. Both a tag and a run by hand deploy the game and the PDFs
# to GitHub Pages: the game at the root, the PDFs under print/.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dev/requirements.txt

      - name: Install Pango, the fonts and pdftoppm
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 \
            fonts-noto-core fonts-noto-cjk fonts-dejavu-core fonts-tibetan-machine \
            poppler-utils
          fc-cache -f

      - name: Install the tools
        run: |
          npm ci
          pip install -r dev/requirements.txt

      - name: Test
        run: npm test

      - name: Build the game
        run: |
          npm run build
          mkdir -p build
          (cd dist && zip -r ../build/tactile-turtle-web.zip .)

      - name: Generate the PDFs
        run: |
          python dev/print/generate_stickers.py
          # The smaller kits for a class that starts with the first worlds.
          for worlds in 1 1-2 1-3; do
            python dev/print/generate_stickers.py --worlds "$worlds"
          done

      - name: Read the PDFs back with the detector
        run: npm run verify:print

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            print/*.pdf
            build/tactile-turtle-web.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "Tactile Turtle $TAG" --generate-notes
          gh release upload "$TAG" print/*.pdf build/tactile-turtle-web.zip --clobber

      - name: Put the site together
        run: |
          mkdir -p build/site/print
          cp -r dist/. build/site/
          cp print/*.pdf build/site/print/
          python dev/print/build_print_page.py build/site/print

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  pages:
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
