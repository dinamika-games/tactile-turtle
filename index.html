<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Tactile Turtle</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0e1a22; color: #fff; overflow: hidden;
        font-family: "Noto Sans", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
      /* Every picture is fitted to the screen (src/ui/stage.ts), with room at the bottom. */
      #stage { position: fixed; inset: 0; padding: 2vh 2vw 7vh; box-sizing: border-box; display: flex; align-items: center; justify-content: center; }
      #stage svg { display: block; height: auto; }
      .pair { display: flex; gap: 2vw; align-items: center; justify-content: center; }
      @media (orientation: portrait) { .pair { flex-direction: column; gap: 2vh; } }

      /* The menus and the bar of a level, over the stage. */
      #overlay { position: fixed; inset: 0; pointer-events: none; }
      #overlay > * { pointer-events: auto; }
      .menu { position: absolute; inset: 0; overflow: auto; background: rgba(8, 20, 28, 0.72); backdrop-filter: blur(3px);
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6vh; padding: 4vh 4vw; box-sizing: border-box; }
      .menu h1 { font-size: clamp(2.2rem, 7vw, 4.5rem); margin: 0 0 2vh; text-shadow: 0 3px 12px #000; }
      .menu h2 { font-size: clamp(1.3rem, 3.4vw, 2.2rem); margin: 0 0 1vh; text-align: center; }
      button { font: inherit; font-weight: 700; font-size: clamp(1.1rem, 2.6vw, 1.6rem); color: #10202a; background: #ffb703;
        border: 0; border-radius: 18px; padding: 0.8em 1.6em; min-height: 64px; min-width: 220px; cursor: pointer;
        box-shadow: 0 4px 0 #b07d00; display: inline-flex; flex-direction: column; align-items: center; gap: 0.2em; }
      button { transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease, background-color 0.12s ease; }
      /* Hover only where there is a mouse (on a tablet, it would stick after a tap). */
      @media (hover: hover) {
        button:not(:disabled):hover { transform: translateY(-3px) scale(1.03); filter: brightness(1.08); box-shadow: 0 7px 0 #b07d00, 0 10px 24px rgba(0, 0, 0, 0.35); }
        button.secondary:not(:disabled):hover { box-shadow: 0 7px 0 #9fb2bc, 0 10px 24px rgba(0, 0, 0, 0.35); }
        button.danger:not(:disabled):hover { box-shadow: 0 7px 0 #a33a33, 0 10px 24px rgba(0, 0, 0, 0.35); }
      }
      button:focus-visible { outline: 4px solid #9cd6ff; outline-offset: 3px; }
      button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b07d00; }
      button.secondary { background: #e9f1f5; box-shadow: 0 4px 0 #9fb2bc; }
      button.danger { background: #f25c54; color: #fff; box-shadow: 0 4px 0 #a33a33; }
      button.small { font-size: clamp(0.95rem, 2vw, 1.15rem); min-height: 48px; min-width: 0; padding: 0.5em 1.1em; }
      button.current { outline: 4px solid #fff; outline-offset: 3px; }
      button.locked, button:disabled { background: #50606a; color: #c7d0d5; box-shadow: none; cursor: default; }
      button .name { font-size: 0.85em; }
      button .meta { font-size: 0.75em; font-weight: 400; opacity: 0.85; }
      button .number { font-size: 0.8em; opacity: 0.8; }
      .grid { display: grid; gap: 1.6vh 1.6vw; grid-template-columns: repeat(auto-fit, minmax(min(220px, 40vw), 1fr)); width: min(1100px, 92vw); }
      .grid button { min-width: 0; }
      .grid.levels button, .grid.worlds button { min-height: 110px; }
      .new { display: flex; gap: 1vw; flex-wrap: wrap; justify-content: center; }
      .new input { font: inherit; font-size: clamp(1rem, 2.4vw, 1.4rem); padding: 0.5em 0.8em; border-radius: 14px; border: 0; min-width: 240px; }
      .list { display: flex; flex-direction: column; gap: 1vh; align-items: center; }
      .row { display: flex; gap: 1vw; align-items: center; }
      .bar { position: absolute; left: 1.5vw; right: 1.5vw; top: 1.2vh; display: flex; gap: 1.5vw; align-items: center; }
      .bar .hint { color: #cfe3ee; font-size: clamp(0.9rem, 2vw, 1.2rem); text-shadow: 0 1px 4px #000; }
      .reward { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 2vh; background: rgba(8, 20, 28, 0.55); }
      .reward .stars { font-size: clamp(3rem, 10vw, 6rem); color: #ffd23f; text-shadow: 0 4px 16px #000; letter-spacing: 0.1em; }
      .reward .title { font-size: clamp(1.8rem, 5vw, 3rem); font-weight: 700; text-shadow: 0 3px 12px #000; }
      .reward .points { font-size: clamp(1.2rem, 3vw, 1.8rem); }
      .reward .buttons { display: flex; gap: 1.5vw; flex-wrap: wrap; justify-content: center; }

      #narration { position: fixed; left: 0; right: 0; bottom: 1rem; text-align: center; color: #8a99a3; font-size: 1.1rem; }
      #debug { position: fixed; right: 0.5rem; bottom: 0.5rem; display: none; text-align: right; font-size: 0.8rem; color: #8f8; }
      body.debug #debug { display: block; }

      /* The webcam during a level: in its own space, never over the level. In
         landscape a column on the right (the stage gives it room), in
         portrait a strip at the bottom. */
      #camera-view { position: fixed; display: none; box-sizing: border-box; }
      #camera-view video { width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); display: block;
        border-radius: 14px; background: #000; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5); }
      body.camera #camera-view { display: block; }
      /* During a level, the bar (back, hint) has its own room at the top. */
      body.camera #stage { padding-top: 9vh; }
      @media (orientation: landscape) {
        body.camera #stage { right: 24vw; }
        #camera-view { right: 2vw; top: 50%; transform: translateY(-50%); width: 21vw; }
        #camera-view video { height: auto; aspect-ratio: 16 / 9; }
      }
      @media (orientation: portrait) {
        body.camera #stage { bottom: 26vh; }
        #camera-view { left: 4vw; right: 4vw; bottom: 3vh; height: 22vh; }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="overlay"></div>
    <div id="narration"></div>
    <div id="camera-view"><video id="video" muted playsinline></video></div>
    <div id="debug"><div id="stats"></div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
